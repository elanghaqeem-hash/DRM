[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drm-bank"
version = "0.1.0"
description = "Digital Records Management Bank - controlled PoC"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
 "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3",
 "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "alembic>=1.14,<2",
 "sqlalchemy>=2.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "bandit>=1.8,<2", "pip-audit>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires migrated disposable PostgreSQL"]

[tool.ruff]
line-length = 100

[tool.bandit]
exclude_dirs = ["tests"]
