name: drm-bank-poc
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objdata:/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes"]
    volumes: ["redisdata:/data"]
  migrate:
    build: .
    user: root
    env_file: .env
    command: ["sh", "-c", "alembic -c infra/alembic.ini upgrade head && python infra/scripts/provision_runtime.py"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    build: .
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?}
      OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:-drm-web}
      OIDC_ENFORCE: "true"
      DRM_ENV: poc
      AUDIT_ANCHOR_REQUIRED: "false"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  pgdata:
  objdata:
  redisdata:
